metadata:
  SID:
    description: "Standard Instrument Departure procedure leg record"
    record_length: 132
    max_continuations: 3

  STAR:
    description: "Standard Terminal Arrival procedure leg record"
    record_length: 132
    max_continuations: 3

  APPROACH:
    description: "Instrument approach procedure leg record"
    record_length: 132
    max_continuations: 3

  MISSED_APPROACH:
    description: "Missed approach procedure leg record"
    record_length: 132
    max_continuations: 3

continuation_rules:
  SID:
    - ProcedureNameDescription
  STAR:
    - ProcedureNameDescription
  APPROACH:
    - ProcedureNameDescription
  MISSED_APPROACH:
    - ProcedureNameDescription

validation_rules:
  SID:
    - field: AirportIdentifier
      rule: non_empty
    - field: ProcedureIdentifier
      rule: non_empty
    - field: PathTerminator
