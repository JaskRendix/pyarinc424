metadata:
  COMPANY_ROUTE_LEG:
    description: "Primary company route leg"
    record_length: 132
    max_continuations: 4

  COMPANY_ROUTE_ALTERNATE_LEG:
    description: "Alternate routing leg for company route"
    record_length: 132
    max_continuations: 4

  COMPANY_ROUTE_CONDITIONAL_LEG:
    description: "Conditional leg for company route"
    record_length: 132
    max_continuations: 4

continuation_rules:
  COMPANY_ROUTE_LEG:
    - LegNameDescription

  COMPANY_ROUTE_ALTERNATE_LEG:
    - AlternateLegDescription

  COMPANY_ROUTE_CONDITIONAL_LEG:
    - ConditionalLegDescription

validation_rules:
  COMPANY_ROUTE_LEG:
    - field: CompanyRouteIdentifier
      rule: non_empty
    - field: FixIdentifier
      rule: non_empty

  COMPANY_ROUTE_ALTERNATE_LEG:
    - field: CompanyRouteIdentifier
      rule: non_empty
    - field: AlternateIdentifier
      rule: non_empty

  COMPANY_ROUTE_CONDITIONAL_LEG:
    - field: CompanyRouteIdentifier
      rule: non_empty
    - field: ConditionCode
      rule: non_empty
