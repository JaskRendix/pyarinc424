      - SectionCode
      - SubsectionCode
      - RegionCode
      - ICAOCode
      - Subsection
      - CompanyRouteIdentifier
      - OriginAirport
      - DestinationAirport
      - SequenceNumber
      - FixIdentifier
      - ICAOCode2
      - PathTerminator
      - Course
      - Distance
