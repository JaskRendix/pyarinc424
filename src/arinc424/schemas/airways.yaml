version: "ARINC 424-20 Airways"

routing:
  E:
    R: ENROUTE_AIRWAY
  P:
    R: TERMINAL_AIRWAY
  U:
    R: UPPER_AIRWAY
  V:
    R: RNAV_AIRWAY

schemas:
  ENROUTE_AIRWAY:
    colspecs:
      - [0, 1]     # RecordType
      - [1, 4]     # CustomerAreaCode
      - [4, 5]     # SectionCode
      - [5, 6]     # SubsectionCode
      - [6, 10]    # RegionCode
      - [10, 12]   # ICAOCode
      - [12, 13]   # Subsection
      - [13, 18]   # AirwayIdentifier
      - [19, 21]   # ICAOCode2
      - [21, 22]   # ContinuationRecordNo
      - [26, 29]   # FromWaypoint
      - [30, 33]   # ToWaypoint
      - [33, 36]   # MinimumAltitude
      - [36, 39]   # MaximumAltitude
      - [41, 44]   # AirwayType
      - [44, 47]   # AirwayDirection
      - [74, 79]   # MagneticVariation
      - [98, 123]  # AirwayNameDescription
      - [123, 128] # FileRecordNo
      - [128, 132] # CycleDate
    names:
      - RecordType
      - CustomerAreaCode
      - SectionCode
      - SubsectionCode
      - RegionCode
      - ICAOCode
      - Subsection
      - AirwayIdentifier
      - ICAOCode2
      - ContinuationRecordNo
      - FromWaypoint
      - ToWaypoint
      - MinimumAltitude
      - MaximumAltitude
      - AirwayType
      - AirwayDirection
      - MagneticVariation
      - AirwayNameDescription
      - FileRecordNo
      - CycleDate

