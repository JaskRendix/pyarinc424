      - [74, 79]
      - [98, 123]
      - [123, 128]
      - [128, 132]
    names:
      - RecordType
      - CustomerAreaCode
      - SectionCode
      - SubsectionCode
      - RegionCode
      - ICAOCode
      - Subsection
      - AirwayIdentifier
      - ICAOCode2
      - ContinuationRecordNo
      - FromWaypoint
      - ToWaypoint
