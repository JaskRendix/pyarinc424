metadata:
  ENROUTE_AIRWAY:
    description: "Standard enroute airway segment"
    record_length: 132
    max_continuations: 3

  TERMINAL_AIRWAY:
    description: "Terminal airway segment"
    record_length: 132
    max_continuations: 3

  UPPER_AIRWAY:
    description: "Upper-level airway segment"
    record_length: 132
    max_continuations: 3

  RNAV_AIRWAY:
    description: "RNAV airway segment"
    record_length: 132
    max_continuations: 3

continuation_rules:
  ENROUTE_AIRWAY:
    - AirwayNameDescription

  TERMINAL_AIRWAY:
    - AirwayNameDescription

  UPPER_AIRWAY:
    - AirwayNameDescription

  RNAV_AIRWAY:
    - AirwayNameDescription

validation_rules:
  ENROUTE_AIRWAY:
    - field: AirwayIdentifier
      rule: non_empty
    - field: FromWaypoint
      rule: non_empty
    - field: ToWaypoint
      rule: non_empty

  TERMINAL_AIRWAY:
    - field: AirwayIdentifier
      rule: non_empty

  UPPER_AIRWAY:
    - field: AirwayIdentifier
      rule: non_empty

  RNAV_AIRWAY:
    - field: AirwayIdentifier
      rule: non_empty
